name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    name: Test and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib

      - name: Schema change has a new schema version
        run: |
          dart run drift_dev make-migrations
          git diff --exit-code -- drift_schemas test/drift
          test -z "$(git status --porcelain -- drift_schemas test/drift)"

      - run: flutter analyze

      - run: flutter test

      - name: Food database build script tests
        run: python3 -I -m unittest discover -s tools

      - run: flutter build apk --release

      # The release APK may declare only the permissions in
      # tools/allowed_permissions.txt (the promises in BRIEF.md).
      - name: Release APK permissions match the allowed list
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          echo "Using $AAPT2"
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk > aapt2-permissions.txt
          cat aapt2-permissions.txt
          sed -n "s/^uses-permission[a-z0-9-]*: name='\([^']*\)'.*/\1/p" aapt2-permissions.txt | sort -u > actual-permissions.txt
          grep -v -e '^#' -e '^[[:space:]]*$' tools/allowed_permissions.txt | sort -u > allowed-permissions.txt
          if ! diff -u allowed-permissions.txt actual-permissions.txt; then
            echo "::error::The APK permissions differ from tools/allowed_permissions.txt. Lines starting with - are allowed but missing, lines starting with + are declared but not allowed."
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: daybook-android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # One APK per phone type, to watch the installed size. The fat APK above
      # is the one uploaded for installing.
      - name: Print the per-ABI APK sizes
        run: |
          flutter build apk --release --split-per-abi
          ls -l build/app/outputs/flutter-apk/*-release.apk
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "$f $(du -h "$f" | cut -f1)"
          done

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned for now. Signing and TestFlight upload come in Phase 6.
      - run: flutter build ios --release --no-codesign

  # The two integration test jobs run on pushes to main and on manual runs
  # only, not on pull requests or other branches.
  android-integration:
    name: Integration test on Android emulator
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Lets the emulator use hardware acceleration on the ubuntu runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Plain AOSP image, no Google services. The first emulator is emulator-5554.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          script: flutter test integration_test -d emulator-5554

  ios-integration:
    name: Integration test on iOS simulator
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Prefer a simulator whose iOS version matches the Xcode in use. If none
      # does, take the newest iPhone on the image.
      - name: Pick and boot an iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          SDKVER="$(xcodebuild -showsdks | grep -Eo 'iphonesimulator[0-9.]+' | head -n 1 | sed 's/iphonesimulator//' || true)"
          echo "Xcode simulator SDK: $SDKVER"
          IDRE='[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}'
          UDID=""
          if [ -n "$SDKVER" ]; then
            UDID="$(xcrun simctl list devices available | awk -v h="-- iOS $SDKVER --" '$0==h{f=1;next} /^-- /{f=0} f' | grep -E '^[[:space:]]+iPhone' | grep -Eo "$IDRE" | tail -n 1 || true)"
          fi
          if [ -z "$UDID" ]; then
            UDID="$(xcrun simctl list devices available | grep -E '^[[:space:]]+iPhone' | grep -Eo "$IDRE" | tail -n 1 || true)"
          fi
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator is available on this runner image."
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl list devices | grep "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # On a freshly booted simulator the log stream that Flutter reads to find
      # the Dart VM service can start after the app has already printed its
      # address. Flutter then waits forever (seen in run 43378321995: the app
      # printed "The Dart VM service is listening" 0.1 s before the stream
      # started). So the first attempt has a time limit and one retry follows.
      # The retry finds the build cached and the simulator warm.
      - name: Run the integration test
        id: attempt1
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -o pipefail
          flutter test integration_test -d "$UDID" --timeout 10m --verbose 2>&1 | tee flutter-test-1.log

      - name: Run the integration test again if the first try failed
        if: steps.attempt1.outcome != 'success'
        timeout-minutes: 12
        run: |
          echo "::warning::The first integration test try failed, trying once more."
          xcrun simctl terminate "$UDID" io.github.bartbasi.daybook || true
          set -o pipefail
          flutter test integration_test -d "$UDID" --timeout 10m --verbose 2>&1 | tee flutter-test-2.log

      - name: What the simulator and the app said
        if: always()
        run: |
          xcodebuild -version
          xcrun simctl list devices booted
          for f in flutter-test-1.log flutter-test-2.log; do
            echo "Lines about the VM service and results in $f"
            grep -n -E "VM Service|Waiting for|Lost connection|All tests passed|Some tests failed|\+[0-9]+: |Exception|Error" "$f" | tail -n 30 || true
          done
          echo "Messages from the app in the simulator log, last 30 minutes"
          xcrun simctl spawn "$UDID" log show --last 30m --style compact --predicate 'process == "Runner" AND (eventMessage CONTAINS "flutter:" OR eventMessage CONTAINS "Terminating" OR eventMessage CONTAINS "crash")' 2>&1 | tail -n 80 || true
          echo "Crash reports"
          ls -l ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -n 10 || true
